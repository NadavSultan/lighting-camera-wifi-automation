[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lighting-camera-wifi-automation-backend"
version = "0.7.0"
description = "Local existing-pole engineering service with conceptual CAP graph planning and reporting"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pyproj>=3.7,<4",
  "reportlab==4.5.1",
  "shapely>=2.1,<3",
  "uvicorn[standard]>=0.35,<1",
  "xlsxwriter==3.2.9",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
